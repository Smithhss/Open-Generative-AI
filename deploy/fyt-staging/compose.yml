name: fyt-creative-staging

services:
  studio:
    image: fyt-studio:staging-20261025-v40
    build:
      context: ../..
      dockerfile: deploy/fyt-staging/Dockerfile
    restart: unless-stopped
    environment:
      # 画布 AI 从容器内部直接调 Go 网关，鉴权沿用浏览器带来的 cookie / Bearer。
      - FYT_INTERNAL_API=http://api:3000
    volumes:
      # 画布 AI 的会话与资产落在这里，容器重建不丢
      - studioData:/app/data
    networks:
      fyt:
        aliases: [fyt-studio]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/create/zh/studio').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 4

volumes:
  studioData:

networks:
  fyt:
    external: true
    name: fyt-staging_default
