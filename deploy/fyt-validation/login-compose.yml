name: fyt-studio-login

services:
  frontend:
    image: nginx:1.24-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ${FYT_VALIDATION_FRONTEND_DIST:?set the built fyt frontend dist/client directory}:/usr/share/nginx/html:ro
      - ./login-nginx.conf:/etc/nginx/conf.d/default.conf:ro
