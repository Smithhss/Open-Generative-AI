server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;

    # Same-origin local split: Next owns only /create, Go owns its API routes.
    # host.docker.internal is Docker Desktop's host, never a production target.
    location = /create {
        proxy_pass http://host.docker.internal:3100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /create/ {
        proxy_pass http://host.docker.internal:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
    # Legacy studio proxies must never reach a real provider in preview mode.
    location ~ ^/api/(api/v1|v1|app|workflow|agents|upload-binary)(/|$) {
        return 404;
    }
    location ~ ^/(api|pg|v1)(/|$) {
        proxy_pass http://host.docker.internal:13100;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /_fyt/ {
        try_files $uri =404;
    }

    # TanStack's client shell resolves /login and /console routes in-browser.
    location / {
        try_files $uri $uri/ /_shell.html;
    }
}
